<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#12100e;
    --panel:#1a1714;
    --panel2:#211c18;
    --card:#221d19;
    --ink:#f2ece2;
    --muted:#a89c8a;
    --muted2:#7a6f61;
    --gold:#d4a24e;
    --gold-dim:#8a6a35;
    --free:#5fb488;
    --free-bg:rgba(95,180,136,0.12);
    --occ:#e07856;
    --occ-bg:rgba(224,120,86,0.14);
    --border:#312a24;
    --border-soft:#292320;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(212,162,78,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(212,162,78,0.05), transparent 45%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  .serif{font-family:'Fraunces', serif;}

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:240px;flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:26px 20px;
    display:flex;flex-direction:column;gap:22px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg, var(--gold), var(--gold-dim));
    display:flex;align-items:center;justify-content:center;font-size:16px;
    box-shadow:0 3px 10px rgba(212,162,78,0.25);
  }
  .brand-text .t1{font-size:15px;font-weight:600;letter-spacing:.01em;}
  .brand-text .t2{font-size:11px;color:var(--muted2);letter-spacing:.03em;}

  .gauge-wrap{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:18px 10px 20px 10px;
    background:var(--panel2);
    border:1px solid var(--border-soft);
    border-radius:16px;
  }
  .gauge{position:relative;width:118px;height:118px;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge-center .pct{font-family:'Fraunces',serif;font-size:24px;font-weight:600;}
  .gauge-center .lbl{font-size:9.5px;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase;margin-top:1px;}
  .gauge-legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);}
  .gauge-legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot.free{background:var(--free);}
  .dot.occ{background:var(--occ);}

  /* ---------- Drive sync panel ---------- */
  .drive-card{
    background:var(--panel2);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:14px;
    font-size:12px;
  }
  .drive-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .drive-icon{width:16px;height:16px;flex-shrink:0;}
  .drive-title{font-weight:600;font-size:12.5px;}
  .drive-status{
    display:flex;align-items:center;gap:6px;
    font-size:11px;color:var(--muted2);margin-bottom:10px;
  }
  .status-led{width:7px;height:7px;border-radius:50%;background:var(--muted2);flex-shrink:0;}
  .status-led.online{background:var(--free);box-shadow:0 0 6px rgba(95,180,136,0.6);}
  .status-led.syncing{background:var(--gold);animation:pulse 1s infinite;}
  .status-led.error{background:var(--occ);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .btn-drive{
    all:unset;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:9px 10px;
    background:#fff;color:#3c4043;
    border-radius:8px;font-size:12.5px;font-weight:600;
    cursor:pointer;
  }
  .btn-drive:hover{background:#f1f1f1;}
  .btn-drive-out{
    all:unset;box-sizing:border-box;
    display:block;width:100%;text-align:center;
    padding:7px 10px;margin-top:8px;
    color:var(--muted2);font-size:11px;cursor:pointer;
  }
  .btn-drive-out:hover{color:var(--occ);}

  nav.navlist{display:flex;flex-direction:column;gap:4px;}
  .navlist button{
    all:unset;cursor:pointer;padding:10px 12px;border-radius:9px;
    font-size:13.5px;color:var(--muted);font-weight:500;
    display:flex;align-items:center;gap:10px;
  }
  .navlist button:hover{background:var(--panel2);color:var(--ink);}
  .navlist button.active{background:rgba(212,162,78,0.1);color:var(--gold);}
  .navlist button .ico{font-size:15px;width:18px;text-align:center;}

  .sidebar-foot{margin-top:auto;font-size:10.5px;color:var(--muted2);line-height:1.6;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:32px 36px 60px 36px;}
  .topline{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .topline h1{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:0 0 4px 0;}
  .topline .sub{color:var(--muted);font-size:13px;}

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search-wrap{position:relative;}
  .search-wrap input{
    background:var(--panel2);border:1px solid var(--border);color:var(--ink);
    padding:9px 14px 9px 32px;border-radius:9px;font-size:13px;width:200px;outline:none;
  }
  .search-wrap input::placeholder{color:var(--muted2);}
  .search-wrap input:focus{border-color:var(--gold-dim);}
  .search-wrap::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:14px;}
  select.pill{background:var(--panel2);border:1px solid var(--border);color:var(--ink);padding:9px 12px;border-radius:9px;font-size:13px;outline:none;}
  .btn{cursor:pointer;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;font-family:inherit;}
  .btn-gold{background:linear-gradient(155deg, var(--gold), var(--gold-dim));color:#1c150a;box-shadow:0 3px 10px rgba(212,162,78,0.2);}
  .btn-ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--border);}
  .btn-danger{background:var(--occ-bg);color:var(--occ);}
  .btn-free{background:var(--free-bg);color:var(--free);}

  .floor-group{margin-bottom:30px;}
  .floor-label{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);margin-bottom:12px;}
  .floor-label::after{content:"";flex:1;height:1px;background:var(--border-soft);}
  .keygrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));gap:14px;}
  .key{
    position:relative;background:linear-gradient(160deg, var(--card), var(--panel));
    border:1px solid var(--border);border-radius:14px;padding:16px 16px 14px 16px;
    cursor:pointer;overflow:hidden;transition:transform .12s ease, border-color .12s ease;
  }
  .key:hover{transform:translateY(-2px);border-color:var(--gold-dim);}
  .key::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
  .key.free::before{background:var(--free);}
  .key.occ::before{background:var(--occ);}
  .key-punch{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:1px solid var(--border);}
  .key-num{font-family:'Fraunces',serif;font-size:22px;font-weight:600;}
  .key-type{font-size:11px;color:var(--muted2);margin-top:1px;text-transform:uppercase;letter-spacing:.05em;}
  .key-status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:12px;padding:4px 9px;border-radius:999px;}
  .key-status.free{background:var(--free-bg);color:var(--free);}
  .key-status.occ{background:var(--occ-bg);color:var(--occ);}
  .key-guest{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .key-guest b{color:var(--ink);font-weight:600;}
  .key-dash{border-top:1px dashed var(--border);margin-top:12px;padding-top:8px;font-size:11px;color:var(--muted2);}

  .empty-msg{padding:50px 20px;text-align:center;color:var(--muted2);font-size:13.5px;}

  .timeline{display:flex;flex-direction:column;gap:0;}
  .tl-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--border-soft);}
  .tl-item:first-child{padding-top:0;}
  .tl-dot-col{display:flex;flex-direction:column;align-items:center;padding-top:3px;}
  .tl-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);}
  .tl-body{flex:1;}
  .tl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .tl-room{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .tl-room span{font-family:'Inter',sans-serif;font-size:11px;color:var(--muted2);font-weight:400;margin-left:8px;text-transform:uppercase;letter-spacing:.04em;}
  .tl-guest{font-size:13px;color:var(--muted);margin-top:3px;}
  .tl-dates{font-size:12px;color:var(--muted2);margin-top:6px;}
  .tl-nights{font-size:11px;background:var(--panel2);border:1px solid var(--border);color:var(--gold);padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .tl-remove{background:none;border:none;color:var(--muted2);font-size:11px;cursor:pointer;margin-top:6px;padding:0;}
  .tl-remove:hover{color:var(--occ);}

  .scrim{position:fixed;inset:0;background:rgba(10,8,6,0.6);backdrop-filter:blur(2px);display:none;z-index:100;}
  .scrim.show{display:block;}
  .panel{
    position:fixed;top:0;right:0;bottom:0;width:100%;max-width:400px;
    background:var(--panel);border-left:1px solid var(--border);
    box-shadow:-20px 0 50px rgba(0,0,0,0.4);
    transform:translateX(100%);transition:transform .22s ease;
    z-index:101;overflow-y:auto;padding:26px 24px 30px 24px;
  }
  .scrim.show .panel{transform:translateX(0);}
  .panel-close{position:absolute;top:20px;right:20px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;}
  .panel h2{font-family:'Fraunces',serif;font-size:21px;margin:0 0 2px 0;}
  .panel .panel-sub{font-size:12.5px;color:var(--muted2);margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;font-weight:600;}
  .field input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--ink);padding:10px 12px;border-radius:8px;font-size:13.5px;outline:none;font-family:inherit;}
  .field input:focus{border-color:var(--gold-dim);}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  .panel-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px;}
  .panel-actions .btn{width:100%;}
  .panel-actions .row2 .btn{width:100%;}

  .sidebar-close{
    display:none;
    margin-left:auto;
    background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;flex-shrink:0;
  }
  .sidebar-scrim{
    display:none;
    position:fixed;inset:0;
    background:rgba(10,8,6,0.55);
    z-index:49;
  }
  .sidebar-scrim.show{display:block;}

  @media (max-width:760px){
    .sidebar{position:fixed;z-index:50;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s ease;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:20px 16px 60px 16px;}
    .mobile-menu-btn{display:inline-flex;background:var(--panel2);border:1px solid var(--border);color:var(--ink);width:36px;height:36px;border-radius:9px;align-items:center;justify-content:center;font-size:16px;cursor:pointer;margin-right:10px;}
    .sidebar-close{display:inline-flex;align-items:center;justify-content:center;}
  }
  @media (min-width:761px){.mobile-menu-btn{display:none;}}
</style>
</head>
<body>

<div class="app">

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">🔑</div>
      <div class="brand-text">
        <div class="t1">Room Manager</div>
        <div class="t2">FRONT DESK</div>
      </div>
      <button class="sidebar-close" id="sidebarCloseBtn">✕</button>
    </div>

    <div class="gauge-wrap">
      <div class="gauge">
        <svg width="118" height="118" viewBox="0 0 118 118">
          <circle cx="59" cy="59" r="50" fill="none" stroke="#2a241f" stroke-width="10"/>
          <circle id="gaugeArc" cx="59" cy="59" r="50" fill="none" stroke="#d4a24e" stroke-width="10"
                  stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314"/>
        </svg>
        <div class="gauge-center">
          <div class="pct" id="gaugePct">0%</div>
          <div class="lbl">Occupied</div>
        </div>
      </div>
      <div class="gauge-legend">
        <span><i class="dot free"></i> <span id="statFree">0</span> free</span>
        <span><i class="dot occ"></i> <span id="statOcc">0</span> occ.</span>
      </div>
    </div>

    <div class="drive-card">
      <div class="drive-head">
        <svg class="drive-icon" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg">
          <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
          <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/>
          <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
          <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
          <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
          <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
        </svg>
        <div class="drive-title">Google Drive</div>
      </div>
      <div class="drive-status" id="driveStatus">
        <span class="status-led" id="driveLed"></span>
        <span id="driveStatusText">Not connected</span>
      </div>
      <button class="btn-drive" id="driveConnectBtn">
        <svg width="15" height="15" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>
        <span id="driveBtnLabel">Sign in with Google</span>
      </button>
      <button class="btn-drive-out" id="driveSignOutBtn" style="display:none;">Disconnect</button>
    </div>

    <nav class="navlist">
      <button class="active" id="navRooms"><span class="ico">▦</span> Rooms</button>
      <button id="navHistory"><span class="ico">◷</span> History</button>
    </nav>

    <div class="sidebar-foot">
      <span id="statTotal">0</span> total rooms<br>
      <span id="storageMode">Stored locally on this device</span>
    </div>
  </aside>

  <main class="main">
    <div class="topline">
      <div>
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <h1 id="viewTitle" style="display:inline;">Rooms</h1>
        <div class="sub" id="viewSub">Live occupancy across your property</div>
      </div>
      <div class="controls" id="roomsControls">
        <div class="search-wrap"><input type="text" id="searchBox" placeholder="Room or guest…"></div>
        <select class="pill" id="filterSelect">
          <option value="all">All rooms</option>
          <option value="free">Free only</option>
          <option value="occupied">Occupied only</option>
        </select>
        <button class="btn btn-gold" id="addRoomBtn">+ Add Room</button>
      </div>
      <div class="controls" id="historyControls" style="display:none;">
        <div class="search-wrap"><input type="text" id="historySearchBox" placeholder="Room or guest…"></div>
      </div>
    </div>

    <div id="roomsView"></div>
    <div id="historyView" style="display:none;">
      <div class="timeline" id="timeline"></div>
    </div>
  </main>

</div>

<div class="scrim" id="scrim">
  <div class="panel" id="panel"></div>
</div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const STORAGE_KEY = "hotel_room_manager_v1";
const DRIVE_FILE_NAME = "room-manager-data.json";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_CONNECTED_FLAG = "hotel_room_manager_drive_connected";

function cryptoId(){
  return 'r_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    rooms: [
      {id: cryptoId(), number:"101", type:"Standard", status:"free", guest:"", phone:"", checkin:"", checkout:""},
      {id: cryptoId(), number:"102", type:"Standard", status:"free", guest:"", phone:"", checkin:"", checkout:""},
      {id: cryptoId(), number:"201", type:"Deluxe", status:"free", guest:"", phone:"", checkin:"", checkout:""},
      {id: cryptoId(), number:"202", type:"Deluxe", status:"free", guest:"", phone:"", checkin:"", checkout:""},
    ],
    history: []
  };
}

let data = loadData();
if(!Array.isArray(data.history)) data.history = [];
let activeTab = 'rooms';

// ---------------- Google Drive sync ----------------
let tokenClient = null;
let accessToken = null;
let tokenExpiresAt = 0;
let driveFileId = null;
let driveReady = false;
let saveDebounce = null;

function setDriveStatus(state, text){
  const led = document.getElementById('driveLed');
  led.className = 'status-led' + (state ? ' ' + state : '');
  document.getElementById('driveStatusText').textContent = text;
}

function gisLoaded(){
  return typeof google !== 'undefined' && google.accounts && google.accounts.oauth2;
}

function initGoogle(){
  if(!gisLoaded()){ setTimeout(initGoogle, 300); return; }
  if(typeof GOOGLE_CLIENT_ID === 'undefined' || GOOGLE_CLIENT_ID.indexOf('YOUR_CLIENT_ID') === 0){
    setDriveStatus('error', 'Not configured (see README)');
    document.getElementById('driveConnectBtn').disabled = true;
    document.getElementById('driveConnectBtn').style.opacity = '0.5';
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: onTokenResponse
  });

  // Attempt silent reconnect if previously connected on this device
  if(localStorage.getItem(DRIVE_CONNECTED_FLAG) === '1'){
    setDriveStatus('syncing', 'Reconnecting…');
    try{
      tokenClient.requestAccessToken({ prompt: '' });
    }catch(e){
      setDriveStatus('', 'Not connected');
    }
  }
}

function onTokenResponse(resp){
  if(resp.error){
    setDriveStatus('error', 'Sign-in failed');
    return;
  }
  accessToken = resp.access_token;
  tokenExpiresAt = Date.now() + (resp.expires_in * 1000) - 30000;
  localStorage.setItem(DRIVE_CONNECTED_FLAG, '1');
  document.getElementById('driveBtnLabel').textContent = 'Connected';
  document.getElementById('driveConnectBtn').style.display = 'none';
  document.getElementById('driveSignOutBtn').style.display = 'block';
  document.getElementById('storageMode').textContent = 'Synced with Google Drive';
  setDriveStatus('syncing', 'Syncing…');
  syncFromDrive();
}

async function ensureToken(){
  if(accessToken && Date.now() < tokenExpiresAt) return accessToken;
  return new Promise((resolve, reject) => {
    if(!tokenClient){ reject('no client'); return; }
    tokenClient.callback = (resp) => {
      onTokenResponse(resp);
      if(resp.error) reject(resp.error); else resolve(resp.access_token);
    };
    tokenClient.requestAccessToken({ prompt: '' });
  });
}

async function driveApi(path, options={}){
  const token = await ensureToken();
  const res = await fetch('https://www.googleapis.com' + path, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + token,
      ...(options.headers || {})
    }
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error('Drive API error ' + res.status + ': ' + text);
  }
  return res;
}

async function findDriveFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await driveApi(`/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`);
  const json = await res.json();
  if(json.files && json.files.length > 0) return json.files[0].id;
  return null;
}

async function syncFromDrive(){
  try{
    driveFileId = await findDriveFile();
    if(driveFileId){
      const res = await driveApi(`/drive/v3/files/${driveFileId}?alt=media`);
      const remote = await res.json();
      if(remote && Array.isArray(remote.rooms)){
        data = remote;
        if(!Array.isArray(data.history)) data.history = [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }
    } else {
      // No file yet in Drive — create it from current local data
      await pushToDrive(true);
    }
    driveReady = true;
    setDriveStatus('online', 'Synced');
    render();
  }catch(e){
    console.error(e);
    setDriveStatus('error', 'Sync error');
  }
}

async function pushToDrive(forceCreate){
  if(!accessToken) return;
  try{
    setDriveStatus('syncing', 'Saving…');
    const body = JSON.stringify(data);
    if(!driveFileId || forceCreate){
      if(!driveFileId) driveFileId = await findDriveFile();
    }
    if(driveFileId){
      await driveApi(`/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body
      });
    } else {
      const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
      const boundary = '-------roommgr' + Date.now();
      const multipartBody =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n` +
        `--${boundary}--`;
      const res = await driveApi(`/upload/drive/v3/files?uploadType=multipart`, {
        method: 'POST',
        headers: {'Content-Type': `multipart/related; boundary=${boundary}`},
        body: multipartBody
      });
      const json = await res.json();
      driveFileId = json.id;
    }
    setDriveStatus('online', 'Synced');
  }catch(e){
    console.error(e);
    setDriveStatus('error', 'Save failed — will retry');
  }
}

function queueDriveSave(){
  if(!accessToken) return;
  if(saveDebounce) clearTimeout(saveDebounce);
  saveDebounce = setTimeout(() => pushToDrive(false), 1200);
}

document.getElementById('driveConnectBtn').addEventListener('click', () => {
  if(!tokenClient){ setDriveStatus('error', 'Google script still loading, try again'); return; }
  tokenClient.callback = onTokenResponse;
  tokenClient.requestAccessToken({ prompt: 'consent' });
});

document.getElementById('driveSignOutBtn').addEventListener('click', () => {
  if(accessToken && typeof google !== 'undefined'){
    google.accounts.oauth2.revoke(accessToken, () => {});
  }
  accessToken = null;
  driveFileId = null;
  driveReady = false;
  localStorage.removeItem(DRIVE_CONNECTED_FLAG);
  document.getElementById('driveBtnLabel').textContent = 'Sign in with Google';
  document.getElementById('driveConnectBtn').style.display = 'flex';
  document.getElementById('driveSignOutBtn').style.display = 'none';
  document.getElementById('storageMode').textContent = 'Stored locally on this device';
  setDriveStatus('', 'Not connected');
});

// ---------------- App logic ----------------
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
  queueDriveSave();
}

function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d + "T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined, {day:'2-digit', month:'short', year:'numeric'});
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function floorOf(number){
  const digits = (number||"").replace(/\D/g,'');
  if(digits.length >= 3) return digits[0] + " Floor";
  if(digits.length === 0) return "Other";
  return "Ground";
}

function nightsBetween(inD, outD){
  if(!inD || !outD) return null;
  const a = new Date(inD+"T00:00:00");
  const b = new Date(outD+"T00:00:00");
  const diff = Math.round((b-a)/86400000);
  return diff >= 0 ? diff : null;
}

function render(){
  const total = data.rooms.length;
  const occ = data.rooms.filter(r=>r.status==='occupied').length;
  const free = total - occ;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statFree').textContent = free;
  document.getElementById('statOcc').textContent = occ;

  const pct = total ? Math.round((occ/total)*100) : 0;
  document.getElementById('gaugePct').textContent = pct + '%';
  const circumference = 314;
  const offset = circumference - (circumference * pct / 100);
  document.getElementById('gaugeArc').style.strokeDashoffset = offset;

  renderRooms();
  renderHistory();
}

function renderRooms(){
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const filter = document.getElementById('filterSelect').value;

  let rooms = [...data.rooms];
  if(filter !== 'all') rooms = rooms.filter(r => r.status === filter);
  if(search){
    rooms = rooms.filter(r =>
      r.number.toLowerCase().includes(search) ||
      (r.guest||"").toLowerCase().includes(search)
    );
  }
  rooms.sort((a,b)=> a.number.localeCompare(b.number, undefined, {numeric:true}));

  const view = document.getElementById('roomsView');
  if(rooms.length === 0){
    view.innerHTML = `<div class="empty-msg">No rooms match. Try clearing filters, or add a room.</div>`;
    return;
  }

  const groups = {};
  rooms.forEach(r => {
    const f = floorOf(r.number);
    if(!groups[f]) groups[f] = [];
    groups[f].push(r);
  });
  const floorNames = Object.keys(groups).sort();

  view.innerHTML = floorNames.map(floor => `
    <div class="floor-group">
      <div class="floor-label">${escapeHtml(floor)}</div>
      <div class="keygrid">
        ${groups[floor].map(r => {
          const isOcc = r.status === 'occupied';
          let guestHtml = '';
          if(isOcc){
            guestHtml = `<div class="key-guest"><b>${escapeHtml(r.guest || 'Guest')}</b></div>`;
          }
          let dashHtml = '';
          if(isOcc && (r.checkin || r.checkout)){
            dashHtml = `<div class="key-dash">${r.checkin ? 'In '+fmtDate(r.checkin):''}${r.checkin&&r.checkout?' · ':''}${r.checkout?'Out '+fmtDate(r.checkout):''}</div>`;
          } else if(!isOcc){
            dashHtml = `<div class="key-dash">Ready for next guest</div>`;
          }
          return `
            <div class="key ${isOcc?'occ':'free'}" onclick="openRoom('${r.id}')">
              <div class="key-punch"></div>
              <div class="key-num">${escapeHtml(r.number)}</div>
              <div class="key-type">${escapeHtml(r.type || 'Room')}</div>
              <div class="key-status ${isOcc?'occ':'free'}">${isOcc?'● Occupied':'● Free'}</div>
              ${guestHtml}
              ${dashHtml}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');
}

function renderHistory(){
  const search = document.getElementById('historySearchBox').value.trim().toLowerCase();
  let entries = [...data.history].sort((a,b)=> (b.loggedAt||'').localeCompare(a.loggedAt||''));
  if(search){
    entries = entries.filter(h =>
      (h.number||'').toLowerCase().includes(search) ||
      (h.guest||'').toLowerCase().includes(search)
    );
  }
  const tl = document.getElementById('timeline');
  if(entries.length === 0){
    tl.innerHTML = `<div class="empty-msg">No stays recorded yet. History fills up as rooms are checked out.</div>`;
    return;
  }
  tl.innerHTML = entries.map(h => {
    const nights = nightsBetween(h.checkin, h.checkout);
    return `
      <div class="tl-item">
        <div class="tl-dot-col"><div class="tl-dot"></div></div>
        <div class="tl-body">
          <div class="tl-top">
            <div class="tl-room">Room ${escapeHtml(h.number)}<span>${escapeHtml(h.type||'')}</span></div>
            ${nights !== null ? `<div class="tl-nights">${nights} night${nights===1?'':'s'}</div>` : ''}
          </div>
          <div class="tl-guest">${escapeHtml(h.guest || 'Guest')}${h.phone ? ' · ' + escapeHtml(h.phone) : ''}</div>
          <div class="tl-dates">${h.checkin ? 'In '+fmtDate(h.checkin):''}${h.checkin&&h.checkout?'  →  ':''}${h.checkout?'Out '+fmtDate(h.checkout):''}</div>
          <button class="tl-remove" onclick="deleteHistoryEntry('${h.id}')">Remove entry</button>
        </div>
      </div>
    `;
  }).join('');
}

function deleteHistoryEntry(id){
  if(!confirm('Remove this history entry?')) return;
  data.history = data.history.filter(h=>h.id!==id);
  save();
}

const scrim = document.getElementById('scrim');
const panel = document.getElementById('panel');

function closePanel(){
  scrim.classList.remove('show');
  setTimeout(()=>{ panel.innerHTML=''; }, 200);
}

function openRoom(id){
  const r = data.rooms.find(x=>x.id===id);
  if(!r) return;
  const isOcc = r.status === 'occupied';

  panel.innerHTML = `
    <button class="panel-close" onclick="closePanel()">✕</button>
    <h2>Room ${escapeHtml(r.number)}</h2>
    <div class="panel-sub">${isOcc ? 'Currently occupied' : 'Currently free'}</div>

    <div class="field"><label>Room Number</label><input type="text" id="f_number" value="${escapeHtml(r.number)}"></div>
    <div class="field"><label>Room Type</label><input type="text" id="f_type" value="${escapeHtml(r.type||'')}" placeholder="Standard, Deluxe, Suite…"></div>
    <div class="field"><label>Guest Name</label><input type="text" id="f_guest" value="${escapeHtml(r.guest||'')}" placeholder="Guest name"></div>
    <div class="field"><label>Phone</label><input type="text" id="f_phone" value="${escapeHtml(r.phone||'')}" placeholder="Contact number"></div>
    <div class="row2">
      <div class="field"><label>Check-in</label><input type="date" id="f_checkin" value="${r.checkin||''}"></div>
      <div class="field"><label>Check-out</label><input type="date" id="f_checkout" value="${r.checkout||''}"></div>
    </div>

    <div class="panel-actions">
      ${isOcc
        ? `<button class="btn btn-free" onclick="markFree('${r.id}')">Mark Free (Checkout)</button>`
        : `<button class="btn btn-gold" onclick="markOccupied('${r.id}')">Save &amp; Mark Occupied</button>`
      }
      <div class="row2">
        <button class="btn btn-ghost" onclick="saveDetailsOnly('${r.id}')">Save Details</button>
        <button class="btn btn-danger" onclick="deleteRoom('${r.id}')">Delete</button>
      </div>
    </div>
  `;
  scrim.classList.add('show');
}

function readForm(){
  return {
    number: document.getElementById('f_number').value.trim(),
    type: document.getElementById('f_type').value.trim(),
    guest: document.getElementById('f_guest').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    checkin: document.getElementById('f_checkin').value,
    checkout: document.getElementById('f_checkout').value,
  };
}

function markOccupied(id){
  const r = data.rooms.find(x=>x.id===id);
  const f = readForm();
  if(!f.number){ alert('Room number is required.'); return; }
  Object.assign(r, f);
  r.status = 'occupied';
  save();
  closePanel();
}

function markFree(id){
  const r = data.rooms.find(x=>x.id===id);
  const f = readForm();
  if(!f.number){ alert('Room number is required.'); return; }

  if(f.guest || f.checkin || f.checkout){
    data.history.push({
      id: cryptoId(),
      number: f.number,
      type: f.type,
      guest: f.guest,
      phone: f.phone,
      checkin: f.checkin,
      checkout: f.checkout,
      loggedAt: new Date().toISOString()
    });
  }

  r.number = f.number;
  r.type = f.type;
  r.status = 'free';
  r.guest = '';
  r.phone = '';
  r.checkin = '';
  r.checkout = '';
  save();
  closePanel();
}

function saveDetailsOnly(id){
  const r = data.rooms.find(x=>x.id===id);
  const f = readForm();
  if(!f.number){ alert('Room number is required.'); return; }
  Object.assign(r, f);
  save();
  closePanel();
}

function deleteRoom(id){
  if(!confirm('Delete this room permanently?')) return;
  data.rooms = data.rooms.filter(x=>x.id!==id);
  save();
  closePanel();
}

document.getElementById('addRoomBtn').addEventListener('click', () => {
  panel.innerHTML = `
    <button class="panel-close" onclick="closePanel()">✕</button>
    <h2>New Room</h2>
    <div class="panel-sub">Add a room to your property</div>
    <div class="field"><label>Room Number</label><input type="text" id="new_number" placeholder="e.g. 103"></div>
    <div class="field"><label>Room Type</label><input type="text" id="new_type" placeholder="Standard, Deluxe, Suite…"></div>
    <div class="panel-actions">
      <button class="btn btn-gold" id="confirmAddBtn">Add Room</button>
    </div>
  `;
  scrim.classList.add('show');
  document.getElementById('confirmAddBtn').addEventListener('click', () => {
    const number = document.getElementById('new_number').value.trim();
    const type = document.getElementById('new_type').value.trim();
    if(!number){ alert('Room number is required.'); return; }
    if(data.rooms.some(r=>r.number.toLowerCase() === number.toLowerCase())){
      alert('A room with this number already exists.'); return;
    }
    data.rooms.push({id:cryptoId(), number, type, status:'free', guest:'', phone:'', checkin:'', checkout:''});
    save();
    closePanel();
  });
});

scrim.addEventListener('click', (e) => { if(e.target === scrim) closePanel(); });

document.getElementById('searchBox').addEventListener('input', renderRooms);
document.getElementById('filterSelect').addEventListener('change', renderRooms);
document.getElementById('historySearchBox').addEventListener('input', renderHistory);

function switchTab(tab){
  activeTab = tab;
  const isRooms = tab === 'rooms';
  document.getElementById('roomsView').style.display = isRooms ? '' : 'none';
  document.getElementById('historyView').style.display = isRooms ? 'none' : '';
  document.getElementById('roomsControls').style.display = isRooms ? '' : 'none';
  document.getElementById('historyControls').style.display = isRooms ? 'none' : '';
  document.getElementById('navRooms').classList.toggle('active', isRooms);
  document.getElementById('navHistory').classList.toggle('active', !isRooms);
  document.getElementById('viewTitle').textContent = isRooms ? 'Rooms' : 'History';
  document.getElementById('viewSub').textContent = isRooms ? 'Live occupancy across your property' : 'Past stays and checkouts';
  closeSidebar();
  if(!isRooms) renderHistory();
}
document.getElementById('navRooms').addEventListener('click', () => switchTab('rooms'));
document.getElementById('navHistory').addEventListener('click', () => switchTab('history'));

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarScrim').classList.add('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarScrim').classList.remove('show');
}
document.getElementById('mobileMenuBtn').addEventListener('click', () => {
  const sidebar = document.getElementById('sidebar');
  if(sidebar.classList.contains('open')) closeSidebar(); else openSidebar();
});
document.getElementById('sidebarCloseBtn').addEventListener('click', closeSidebar);
document.getElementById('sidebarScrim').addEventListener('click', closeSidebar);
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeSidebar(); });

render();
initGoogle();
</script>
